{% extends 'base.html' %}
{% load static %}

{% block title %}Đăng ký tài khoản | An Hoang Store{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <!-- Header -->
                <div class="p-4 text-center" style="background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%); color: white;">
                    <div class="brand-icon mx-auto mb-2" style="width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #4f46e5, #0ea5e9); display: flex; align-items: center; justify-content: center; font-size: 1.2rem;">
                        <i class="fas fa-user-plus"></i>
                    </div>
                    <h4 class="fw-bold mb-1">Tạo Tài Khoản Mới</h4>
                    <p class="small text-secondary mb-0">Đăng ký để nhận ưu đãi và mua sắm tiện lợi hơn</p>
                </div>

                <!-- Body -->
                <div class="card-body p-4">
                    <form method="post" id="registerForm">
                        {% csrf_token %}

                        <!-- Tên đăng nhập -->
                        <div class="mb-3">
                            <label for="id_username" class="form-label small fw-bold">Tên đăng nhập <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" id="id_username" name="username" 
                                       value="{{ initial_data.username|default:'' }}" placeholder="Ví dụ: hoangan123" required autofocus>
                            </div>
                        </div>

                        <!-- Họ và Tên -->
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="id_last_name" class="form-label small fw-bold">Họ & Tên đệm</label>
                                <input type="text" class="form-control" id="id_last_name" name="last_name" 
                                       value="{{ initial_data.last_name|default:'' }}" placeholder="Nguyễn">
                            </div>
                            <div class="col-md-6">
                                <label for="id_first_name" class="form-label small fw-bold">Tên <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="id_first_name" name="first_name" 
                                       value="{{ initial_data.first_name|default:'' }}" placeholder="Văn A" required>
                            </div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label for="id_email" class="form-label small fw-bold">Địa chỉ Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="email" class="form-control border-start-0 ps-0" id="id_email" name="email" 
                                       value="{{ initial_data.email|default:'' }}" placeholder="email@example.com">
                            </div>
                        </div>

                        <!-- Mật khẩu -->
                        <div class="mb-3">
                            <label for="id_password1" class="form-label small fw-bold">Mật khẩu <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-key text-muted"></i></span>
                                <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="id_password1" name="password1" placeholder="Tối thiểu 6 ký tự..." required>
                                <button class="btn btn-light border border-start-0 text-muted" type="button" id="togglePassword1" style="background:#f8fafc;">
                                    <i class="fas fa-eye" id="eyeIcon1"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Xác nhận mật khẩu -->
                        <div class="mb-4">
                            <label for="id_password2" class="form-label small fw-bold">Xác nhận mật khẩu <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-shield-check text-muted"></i></span>
                                <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="id_password2" name="password2" placeholder="Nhập lại mật khẩu..." required>
                                <button class="btn btn-light border border-start-0 text-muted" type="button" id="togglePassword2" style="background:#f8fafc;">
                                    <i class="fas fa-eye" id="eyeIcon2"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm mb-3">
                            <i class="fas fa-user-check me-2"></i> ĐĂNG KÝ VÀ VÀO CỬA HÀNG
                        </button>

                        <div class="text-center small text-muted">
                            Đã có tài khoản? <a href="{% url 'login' %}" class="fw-bold text-primary text-decoration-none">Đăng nhập</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    function setupToggle(btnId, inputId, iconId) {
        const btn = document.getElementById(btnId);
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (btn && input && icon) {
            btn.addEventListener('click', function() {
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.classList.remove('fa-eye');
                    icon.classList.add('fa-eye-slash');
                } else {
                    input.type = 'password';
                    icon.classList.remove('fa-eye-slash');
                    icon.classList.add('fa-eye');
                }
            });
        }
    }

    setupToggle('togglePassword1', 'id_password1', 'eyeIcon1');
    setupToggle('togglePassword2', 'id_password2', 'eyeIcon2');
});
</script>
{% endblock %}
