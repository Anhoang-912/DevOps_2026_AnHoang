<div class="secure-password-widget" id="{{ widget.attrs.id|default:'id_password' }}">
  <div class="secure-password-card">
    <div class="secure-card-main">
      <div class="secure-badge-pill">
        <i class="fas fa-shield-halved"></i>
        <span>Mật khẩu đã được mã hóa an toàn (PBKDF2-SHA256)</span>
      </div>
      <a href="{{ password_url|default:"../password/" }}" class="btn-change-pwd">
        <i class="fas fa-key"></i> Đặt lại mật khẩu
      </a>
    </div>

    <div class="secure-hash-collapse">
      <div class="secure-hash-title">
        <i class="fas fa-lock"></i> Thông số bảo mật một chiều:
      </div>
      <div class="secure-hash-grid">
        {% for entry in summary %}
          <div class="secure-hash-item">
            <span class="hash-label">{{ entry.label }}:</span>
            <span class="hash-val"><code>{{ entry.value }}</code></span>
          </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
