name: CI/CD - Docker Build & Deploy to EC2

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true
          version: latest

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/devops_2026_web:latest
            ${{ secrets.DOCKER_USERNAME }}/devops_2026_web:${{ github.sha }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # Temp fix to prevent cache growing infinitely
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          # Tự động chuẩn hóa PEM format nếu Secret thiếu header/footer
          if ! grep -q "BEGIN" ~/.ssh/id_rsa; then
            echo "-----BEGIN RSA PRIVATE KEY-----" > ~/.ssh/formatted_key
            cat ~/.ssh/id_rsa >> ~/.ssh/formatted_key
            echo "" >> ~/.ssh/formatted_key
            echo "-----END RSA PRIVATE KEY-----" >> ~/.ssh/formatted_key
            mv ~/.ssh/formatted_key ~/.ssh/id_rsa
          fi
          chmod 600 ~/.ssh/id_rsa
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $EC2_USER@$EC2_HOST bash << 'EOF'
            set -e
            cd ~/DevOps_2026_AnHoang
            git checkout -- db.sqlite3 || true
            git pull origin main
            ./venv/bin/python manage.py migrate --noinput
            ./venv/bin/python manage.py seed_products
            ./venv/bin/python manage.py collectstatic --noinput
            pkill -f gunicorn || true
            sleep 2
            ./venv/bin/gunicorn --workers 2 --threads 4 --timeout 120 --keep-alive 65 --bind 127.0.0.1:8000 web.wsgi:application --daemon
            echo "Deployment completed successfully!"
          EOF
